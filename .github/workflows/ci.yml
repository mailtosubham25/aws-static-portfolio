name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Scan Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=infrastructure/environments/prod fmt -check

      - name: Terraform Init
        run: terraform -chdir=infrastructure/environments/prod init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infrastructure/environments/prod validate

      - name: Set up Python for Checkov
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --upgrade pip && python -m pip install checkov==3.4.6

      - name: Checkov Blocking Baseline
        run: >-
          checkov --directory infrastructure/environments/prod
          --framework terraform
          --output cli
          --check CKV_AWS_19,CKV_AWS_21,CKV_AWS_34,CKV_AWS_53,CKV_AWS_54,CKV_AWS_55,CKV_AWS_56,CKV2_AWS_6,CKV2_AWS_32,CKV2_AWS_46,CKV2_AWS_72

      - name: Checkov Full Report
        run: checkov --directory infrastructure/environments/prod --framework terraform --output cli --soft-fail

      - name: Trivy Infrastructure Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infrastructure/environments/prod
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

      - name: Trivy Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '1'
