name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Scan Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=infrastructure/environments/prod fmt -check

      - name: Terraform Init
        run: terraform -chdir=infrastructure/environments/prod init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infrastructure/environments/prod validate

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: infrastructure/environments/prod
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Trivy Infrastructure Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: infrastructure/environments/prod
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

      - name: Trivy Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
